name: GitHub-Profile-Summary-Cards

on:
  schedule: # regenerate the cards once a day
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          THEME: "github_dark"
          AUTO_PUSH: true

      - name: Fetch streak stats SVG
        run: |
          curl -sf "https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&hide_border=true&background=0D1117&stroke=0D1117&ring=8B5CF6&fire=F59E0B&currStreakLabel=C9D1D9&sideLabels=C9D1D9&currStreakNum=C9D1D9&sideNums=C9D1D9&dates=8B949E" -o assets/streak-stats.svg

      - name: Commit streak stats SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak-stats.svg
          git diff --cached --quiet || git commit -m "Update streak stats card"
          git push
